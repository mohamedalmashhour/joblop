name: Foundation Validation

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches:
      - main
      - "foundation/**"
    paths-ignore:
      - "**.md"
      - "docs/**"

# A new push to a pull request replaces its unfinished run. Runs on main always finish.
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @rwos/database prisma:generate
      - run: pnpm validate
      - run: pnpm validate:containers:static

  # `pnpm validate` skips every suite that needs a database, so this job runs them against a real
  # one. The version matches production. The database exists only for this job.
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rwos_validation_admin
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RWOS_POSTGRES_TEST_MODE: local-disposable
      RWOS_TEST_DATABASE_CONFIRMATION: disposable-test-target
      RWOS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/rwos_validation_admin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @rwos/database prisma:generate
      - run: pnpm test:postgres:required

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - state-bootstrap
          - bootstrap
          - runtime
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Terraform format
        run: terraform -chdir=infrastructure/staging/${{ matrix.package }} fmt -check -diff
      - name: Terraform initialize without backend
        run: terraform -chdir=infrastructure/staging/${{ matrix.package }} init -backend=false -input=false
      - name: Terraform validate
        run: terraform -chdir=infrastructure/staging/${{ matrix.package }} validate -no-color

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Blocking gate: fail the build on any HIGH/CRITICAL advisory in a production
      # (runtime-reachable) dependency. Known mobile/Expo/React-Native-only advisories
      # are baselined in package.json -> pnpm.auditConfig.ignoreGhsas and documented in
      # docs/security/dependency-audit-baseline.md (they are not in any deployed server
      # image). A new runtime-reachable high/critical therefore breaks CI at PR time.
      - name: Dependency advisory gate (production, high+)
        run: pnpm audit --prod --audit-level=high
      # Informational only: the full approved advisory disclosure across all severities and dev deps
      # (matches the `audit:dependencies` script), then production-only. Never blocks.
      - name: Dependency advisory report (informational)
        run: pnpm audit && pnpm audit --prod || true

  # The slowest job. It runs on every push to main, so each image is proven before a deploy.
  container-runtime:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - employer
          - admin
          - worker
          - auth-limiter
          - candidate-source
          - offer-delivery
          - qa-reset
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Capture UTC build timestamp
        id: metadata
        run: echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Build and probe one unpublished container
        env:
          RWOS_CONTAINER_SERVICE: ${{ matrix.service }}
          RWOS_CONTAINER_GIT_SHA: ${{ github.sha }}
          RWOS_CONTAINER_BUILD_TIMESTAMP: ${{ steps.metadata.outputs.timestamp }}
          RWOS_CONTAINER_SOURCE_REPOSITORY: "github.com/drmmashhour-ux/resident-workforce-os"
          RWOS_CONTAINER_IMAGE_VERSION: ${{ github.sha }}
        run: node scripts/validate-containers.mjs
