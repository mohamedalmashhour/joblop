<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b6cf0"/><stop offset="1" stop-color="#1546c8"/></linearGradient>
    <linearGradient id="ar" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7fc9ff"/><stop offset="1" stop-color="#bfe6ff"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- loop: a near-complete ring ("loop") with momentum, open at the top-right for the arrow -->
  <path d="M352 120 A176 176 0 1 1 300 94" fill="none" stroke="url(#ar)" stroke-width="30" stroke-linecap="round" opacity="0.92"/>
  <!-- arrowhead closing the loop (points up-right = forward) -->
  <path d="M300 60 l54 32 -40 36 z" fill="#bfe6ff"/>
  <!-- white JobLop mark, centered inside the loop -->
  <g transform="translate(146,150) scale(3.55)">
    <path d="M26 17a6 6 0 0 1 12 0v4h-4v-4a2 2 0 0 0-4 0v4h-4z" fill="#fff"/>
    <path d="M21 23h22a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6v-6h-4v14a9 9 0 0 1-18 0 3 3 0 0 1 6 0 3 3 0 0 0 6 0V25a2 2 0 0 1 2-2z" fill="#fff"/>
    <rect x="34" y="28" width="7" height="6" rx="2" fill="#1546c8"/>
  </g>
</svg>
