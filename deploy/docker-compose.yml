# JobLop self-hosted stack (NAS / mini-PC / Canadian cloud VM — identical everywhere).
# Build once (the shared image), run Postgres + the four app containers + Caddy.
#
#   cd <repo root>
#   cp deploy/.env.example deploy/.env   # then edit deploy/.env with real secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env build
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env run --rm api \
#       pnpm --filter @rwos/database exec prisma migrate deploy      # apply migrations once
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# Payments/finance stay frozen; do NOT set production payment or FINANCE_LIVE env here.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data   # DS923+: put this on the M.2 NVMe SSD pool, not the HDDs/USB
    # No published port — only the app containers reach it on the internal network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Memory caps so no single service starves the others on the DS923+ (2 cores / 32 GB).
    deploy:
      resources:
        limits:
          memory: 4g

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: joblop:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/apps/api
    command: ["pnpm", "start"]
    environment:
      NODE_ENV: production
      RWOS_ENV: production
      PORT: "4000"
      API_PORT: "4000"
      DATABASE_URL: ${DATABASE_URL}
      RWOS_COUNTRY: ${RWOS_COUNTRY}
      # Real secrets come from deploy/.env — never commit them.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_COUNTRY: ${ADZUNA_COUNTRY:-ca}
    expose: ["4000"]

  worker:
    image: joblop:latest
    depends_on: [api]
    restart: unless-stopped
    working_dir: /app/apps/worker
    command: ["pnpm", "start"]
    environment:
      NODE_ENV: production
      RWOS_ENV: production
      PORT: "8090"
      INTERNAL_API_ORIGIN: http://api:4000
      # Public URL of the worker-facing site — used by robots.txt / sitemap.xml for Google.
      NEXT_PUBLIC_SITE_URL: ${WORKER_PUBLIC_URL:-https://joblop.com}
      # Where the landing's employer links point.
      NEXT_PUBLIC_EMPLOYER_URL: ${EMPLOYER_PUBLIC_URL:-https://employer.joblop.com}
    expose: ["8090"]

  employer:
    image: joblop:latest
    depends_on: [api]
    restart: unless-stopped
    working_dir: /app/apps/employer
    command: ["pnpm", "start"]
    environment:
      NODE_ENV: production
      RWOS_ENV: production
      PORT: "8091"
      INTERNAL_API_ORIGIN: http://api:4000
    expose: ["8091"]

  admin:
    image: joblop:latest
    depends_on: [api]
    restart: unless-stopped
    working_dir: /app/apps/admin
    command: ["pnpm", "start"]
    environment:
      NODE_ENV: production
      RWOS_ENV: production
      PORT: "8092"
      INTERNAL_API_ORIGIN: http://api:4000
    expose: ["8092"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [worker, employer, admin]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
